spring:
  datasource:
    url: jdbc:mysql://localhost:3306/store_api?createDatabaseIfNotExist=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: true

  # The app runs over plain HTTP locally, so the refresh-token cookie can't
  # have the Secure flag here or browsers will silently drop it (Secure
  # cookies require HTTPS, which prod/Railway provides via the
  # forwarded-headers proxy).
  jwt:
    secure-cookie: false

websiteUrl: http://localhost:8080
